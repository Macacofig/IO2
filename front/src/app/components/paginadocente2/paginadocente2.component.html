<div class="paginadocente2-container">
  <button class="boton-cerrar-sesion" (click)="logout()">Cerrar sesión</button>

  <header class="encabezado">
    <h1 class="titulo-principal">INVESTIGACION OPERATIVA 2</h1>
  </header>

  <!-- Botón Volver -->
  <button class="boton-volver" (click)="volverAParalelos()">
    <span class="icono-volver">&#8592;</span> Volver
  </button>

  <!-- Contenido agrupado por competencia -->
  <section class="contenido">
    <div *ngFor="let competencia of competencias">
      <h3 class="subtitulo-competencia">{{ competenciaLabels[competencia] }}</h3>

      <!-- Lista de Documentos -->
      <h4 class="titulo-seccion" *ngIf="competencia !== 'Material Bibliografico'">Lista de documentos</h4>
      <div class="grid-documentos">
        <div class="card-doc" *ngFor="let doc of obtenerItemsPorCompetencia(competencia)">
          <div class="icono-doc">📄</div>
          <p class="nombres-archivos">{{ doc.nombre }}</p>
          <!-- Ícono de borrar -->
          <button class="btn-eliminar" (click)="eliminarDoc(doc.nombre)"> 🗑️ </button>
        </div>
      </div>

      <!-- Lista de Links -->
      <h4 class="titulo-seccion" *ngIf="competencia !== 'Material Bibliografico'">Lista de Links</h4>
      <div class="grid-documentos">
        <div class="card-doc" *ngFor="let link of obtenerLinksPorCompetencia(competencia)">
          <div class="icono-doc">🔗</div>
          <a [href]="link.url" target="_blank" class="nombres-archivos">{{ link.nombre }}</a>
          <button class="btn-eliminar" (click)="eliminarLink(link.nombre)"> 🗑️ </button>
        </div>
      </div>
    </div>
  </section>


  <!-- Formulario emergente -->
  <div *ngIf="mostrarFormulario" class="modal-formulario">
    <h3 class="titulo-subir">Subir {{ tabSeleccionado }}</h3>

    <!-- Mostrar input según el tipo de contenido -->
    <ng-container *ngIf="tabSeleccionado === 'documentos'; else formularioLink">
      <input class="nombres-archivos" type="file" (change)="onFileChange($event)" />
    </ng-container>

    <ng-template #formularioLink>
      <label for="nombreLink">Nombre del Link:</label>
      <input type="text" [(ngModel)]="nombreLink" placeholder="Ej: Video sobre redes" class="nombres-archivos" />

      <label for="urlLink">URL del Link:</label>
      <input type="text" [(ngModel)]="linkSeleccionado" placeholder="https://..." class="nombres-archivos" />
    </ng-template>


    <label for="materia">Materia:</label>
    <input type="text" id="materia" [value]="materiaSeleccionada" readonly />

    <label for="competencia">Competencia:</label>
    <select [(ngModel)]="competenciaSeleccionada" id="competencia">
      <option value="" disabled selected>Seleccione una competencia</option>
      <option
        *ngFor="let c of competencias"
        [value]="c"
        [hidden]="tabSeleccionado === 'links' && c === 'Material Bibliografico'"
      >
        {{ competenciaLabels[c] }}
      </option>
    </select>

    <button (click)="subirContenido()">Subir</button>
    <button (click)="cerrarFormulario()">Cancelar</button>
  </div>

  <!-- Botón flotante + menú -->
  <div class="menu-agregar" [class.abierto]="menuAbierto">
    <button class="boton-agregar" (click)="toggleMenu()">+</button>
    <ul class="submenu" *ngIf="menuAbierto">
      <li (click)="abrirFormulario('documentos')">Documento</li>
      <li (click)="abrirFormulario('links')">Link</li> <!-- Nuevo -->
    </ul>
  </div>

  <!-- Botón para eliminar estudiante
  <div class="eliminarEst">
      <button class="btn-eliminarEst" (click)="desplFormEliminarEst()">Eliminar Estudiante</button>
    </div>
  </div> -->
