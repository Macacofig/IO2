<div class="paginaestudiantes-container">
  <button class="boton-cerrar-sesion" (click)="logout()">Cerrar sesión</button>

  <header class="encabezado">
    <h1 class="titulo-principal">INVESTIGACIÓN OPERATIVA 1</h1>
  </header>

  <button class="boton-volver" (click)="volverAInicio()">
    <span class="icono-volver">&#8592;</span> Volver
  </button>

  <section class="contenido">
    <h3 class="titulo-seccion">Material disponible</h3>

    <div *ngFor="let competencia of competencias">
      <h4 class="subtitulo-competencia">{{ competenciaLabels[competencia] }}</h4>

      <!-- Lista de Documentos -->
      <div *ngIf="obtenerItemsPorCompetencia(competencia, 'documento').length > 0">
        <h5>Lista de Documentos</h5>
        <div class="grid-documentos">
          <div class="card-doc" *ngFor="let doc of obtenerItemsPorCompetencia(competencia, 'documento')">
            <div class="icono-doc">📄</div>
            <p class="nombres-archivos">{{ doc.nombre }}</p>
            <button class="boton-descargar" (click)="descargarDocumento(doc)">Descargar</button>
          </div>
        </div>
      </div>

      <!-- Lista de Links -->
      <div *ngIf="obtenerItemsPorCompetencia(competencia, 'link').length > 0">
        <h5>Lista de Links</h5>
        <div class="grid-documentos">
          <div class="card-doc" *ngFor="let link of obtenerItemsPorCompetencia(competencia, 'link')">
            <div class="icono-doc">🔗</div>
            <p class="nombres-archivos">{{ link.nombre }}</p>
            <button class="boton-descargar" (click)="abrirLink(link)">Abrir link</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Botón flotante para sugerencias -->
  <div class="menu-agregar" [class.abierto]="menuAbierto">
    <button class="boton-agregar" (click)="toggleMenu()">+</button>
    <ul class="submenu" *ngIf="menuAbierto">
      <li (click)="abrirFormulario()">Enviar sugerencia</li>
    </ul>
  </div>

  <!-- Modal sugerencias -->
  <div *ngIf="mostrarFormulario" class="modal-formulario">
    <h3 class="titulo-subir">Enviar sugerencia</h3>

    <label for="competencia">Competencia:</label>
    <select [(ngModel)]="competenciaSeleccionada" id="competencia">
      <option value="" disabled selected>Seleccione una competencia</option>
      <option *ngFor="let c of competencias" [value]="c">{{ competenciaLabels[c] }}</option>
    </select>

    <label for="sugerencia">Comentario:</label>
    <textarea id="sugerencia" [(ngModel)]="sugerenciaTexto" placeholder="Escribe tu comentario aquí..."></textarea>

    <div class="acciones-formulario">
      <button (click)="enviarSugerencia()">Enviar</button>
      <button (click)="cerrarFormulario()">Cancelar</button>
    </div>
  </div>
</div>
